services:
    postgres:
        image: postgres:latest
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
            POSTGRES_DB: ${POSTGRES_DB:-meta}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5

    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: clickhouse
        restart: unless-stopped
        environment:
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_pass}
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
        ports:
            - "8123:8123"
            - "9000:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        container_name: dragonfly
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - dragonfly_data:/data
        command: ["--requirepass", "${REDIS_PASSWORD:-redis_dev_pass}"]
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pass}", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    clickhouse_data:
    dragonfly_data: